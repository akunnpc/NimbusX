name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # AGP 9.1.1 di project ini butuh cmdline-tools yang cukup baru buat resolve
      # compileSdk 36, jadi kita install manual daripada andelin default image.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36 & build-tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # setup-gradle sudah handle caching (wrapper, dependencies, build cache)
      # otomatis, jadi gak perlu actions/cache manual.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Zip/export project ini gak menyertakan gradlew, jadi kita generate sendiri.
      # Dipin ke versi yang cocok sama AGP 9.1.1 + Kotlin 2.2.10.
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      # Secrets Gradle Plugin wajib nemu file .env, kalau gak ada, build gagal
      # saat baca GEMINI_API_KEY. .env.example dipakai sebagai fallback aman.
      - name: Set up local env file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      # google-services plugin sudah di-set missingGoogleServicesStrategy = WARN
      # di app/build.gradle.kts, jadi gak perlu bikin google-services.json dummy.
      # Kalau nanti mau dipakai beneran, taruh via GitHub Secret + decode base64 di sini.

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore
