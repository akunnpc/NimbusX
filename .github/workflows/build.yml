name: Build & Test Android Project

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build with Gradle
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses

    # Project ini pakai compileSdk 36, jadi platform & build-tools wajib versi terbaru
    - name: Install latest SDK platform & build-tools
      run: |
        sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

    - name: Set up Gradle (pin version)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.6.1'

    # Zip ini TIDAK menyertakan gradlew, jadi wrapper harus di-generate.
    # AGP-nya 9.1.1 & Kotlin 2.2.10, jadi pakai Gradle 9.6.1 (compatible)
    - name: Generate Gradle wrapper if missing
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew not found — generating wrapper (Gradle 9.6.1)..."
          gradle wrapper --gradle-version 9.6.1
        else
          echo "gradlew already present in repo"
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Diagnostic: Java & Gradle
      run: |
        echo "=== java -version ==="
        java -version || true
        echo "=== gradle --version (system) ==="
        gradle --version || true
        if [ -f gradlew ]; then
          echo "=== ./gradlew --version (wrapper) ==="
          ./gradlew --version || true
          echo "=== gradle/wrapper/gradle-wrapper.properties ==="
          sed -n '1,200p' gradle/wrapper/gradle-wrapper.properties || true
        else
          echo "No gradlew in repo"
        fi
        echo "=== Workspace listing ==="
        ls -la

    # Secrets Gradle Plugin butuh .env, fallback ke .env.example biar GEMINI_API_KEY placeholder ke-cover
    - name: Create .env from example (if missing)
      run: |
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
        fi

    # Project pakai plugin google-services tapi google-services.json tidak disertakan di zip.
    # googleServices.missing.passthrough=true di gradle.properties sudah handle ini,
    # jadi build tetap jalan walau file ini tidak ada. Tidak perlu dummy file.

    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias androiddebugkey -keypass android \
          -storepass android \
          -dname "CN=Android Debug,O=Android,C=US" \
          -noprompt

    - name: Build debug APK
      run: |
        if [ -f ./gradlew ]; then
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build-output.log
        else
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build-output.log
        fi

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output-log
        path: build-output.log
        retention-days: 7

    # includeAndroidResources = true (buat Roborazzi/Robolectric), jadi unit test butuh resources di-resolve dulu
    - name: Run unit tests
      run: |
        if [ -f ./gradlew ]; then
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --info 2>&1 | tee test-output.log
        else
          gradle testDebugUnitTest --no-daemon --stacktrace --info 2>&1 | tee test-output.log
        fi

    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-output-log
        path: test-output.log
        retention-days: 7

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/
        retention-days: 30

    - name: Upload debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses

    - name: Install latest SDK platform & build-tools
      run: |
        sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

    - name: Set up Gradle (pin version)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.6.1'

    - name: Generate Gradle wrapper if missing
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew not found — generating wrapper (Gradle 9.6.1)..."
          gradle wrapper --gradle-version 9.6.1
        else
          echo "gradlew already present in repo"
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Create .env from example (if missing)
      run: |
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
        fi

    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias androiddebugkey -keypass android \
          -storepass android \
          -dname "CN=Android Debug,O=Android,C=US" \
          -noprompt

    - name: Run Android Lint
      run: |
        if [ -f ./gradlew ]; then
          ./gradlew lintDebug --no-daemon --stacktrace --info 2>&1 | tee lint-output.log
        else
          gradle lintDebug --no-daemon --stacktrace --info 2>&1 | tee lint-output.log
        fi

    - name: Upload lint log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-output-log
        path: lint-output.log
        retention-days: 7

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html
        retention-days: 30
